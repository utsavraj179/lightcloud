<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plans – LightCloud</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#05060f;--card:rgba(20,22,48,.55);--line:rgba(160,170,255,.18);--tx:#eef0ff;--mu:#9aa0c8;--ac:#8b9cff;--ac2:#c9b8ff}
html{scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;overflow-x:hidden}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0}
nav,main,footer{position:relative;z-index:1}
nav{position:sticky;top:env(safe-area-inset-top,0px);display:flex;justify-content:space-between;align-items:center;padding:14px 5vw;backdrop-filter:blur(12px);background:rgba(5,6,15,.55);border-bottom:1px solid var(--line);z-index:5}
.logo{font-weight:800;letter-spacing:.12em;color:var(--tx);text-decoration:none}
.logo span{color:var(--ac)}
nav a.l{color:var(--mu);text-decoration:none;font-size:14px}
.btn{display:inline-block;padding:12px 24px;border-radius:999px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#0a0b1e!important;font-weight:700;text-decoration:none}
main{max-width:1150px;margin:auto;padding:60px 5vw 80px}
h1{font-size:clamp(34px,6vw,56px);margin:0 0 10px;text-align:center}
h1 em{font-style:normal;background:linear-gradient(135deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mu);text-align:center;margin:0 0 30px}
.tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:34px}
.tab{padding:9px 18px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--mu);cursor:pointer;font-size:14px;font-family:inherit}
.tab.on{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#0a0b1e;border-color:transparent;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px;text-align:center;backdrop-filter:blur(10px);transition:transform .25s,border-color .25s}
.card:hover{transform:translateY(-6px);border-color:var(--ac)}
.card.hot{border-color:var(--ac);box-shadow:0 0 40px rgba(139,156,255,.18)}
.card h3{margin:0}
.price{font-size:42px;font-weight:800;margin:10px 0 2px}
.price small{font-size:14px;color:var(--mu);font-weight:500}
.ram{color:var(--ac);font-weight:700;margin-bottom:14px}
.card ul{list-style:none;padding:0;margin:0 0 20px;color:var(--mu);font-size:14px;line-height:2}
h2{text-align:center;margin:70px 0 20px}
.wrap{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--card);backdrop-filter:blur(10px)}
table{width:100%;border-collapse:collapse;min-width:520px;font-size:14px}
th,td{padding:12px 16px;text-align:left;border-bottom:1px solid var(--line)}
th{color:var(--ac);font-weight:700}
td{color:var(--mu)}
td:first-child{color:var(--tx);font-weight:700}
tr:last-child td{border-bottom:0}
footer{text-align:center;padding:40px 5vw;color:var(--mu);border-top:1px solid var(--line);font-size:14px}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<nav>
  <a class="logo" href="index.html">LIGHT<span>CLOUD</span></a>
  <a class="l" href="index.html">← Home</a>
</nav>
<main>
  <h1>Light Cloud <em>Plans</em></h1>
  <p class="sub">Ryzen 7 Budget Plans · Power your world</p>
  <div class="tabs" id="tabs"></div>
  <div class="grid" id="grid"></div>
  <h2>Compare all plans</h2>
  <div class="wrap"><table><thead><tr><th>Plan</th><th>RAM</th><th>CPU</th><th>Disk</th><th>Price</th></tr></thead><tbody id="rows"></tbody></table></div>
</main>
<footer>AMD Ryzen 7 · NVMe SSD · DDoS Protection · AetherPanel · High Performance</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ---- Edit plans here ----
const PLANS=[
 {name:"MINI",price:10,ram:1,cpu:"1 vCPU",disk:10},
 {name:"STARTER",price:20,ram:2,cpu:"150 CPU",disk:15},
 {name:"BASIC",price:40,ram:4,cpu:"200 CPU",disk:25},
 {name:"PLUS",price:70,ram:6,cpu:"250 CPU",disk:40},
 {name:"PRO",price:130,ram:8,cpu:"300 CPU",disk:50},
 {name:"ULTRA",price:160,ram:12,cpu:"350 CPU",disk:70},
 {name:"ADVANCED",price:200,ram:16,cpu:"400 CPU",disk:90},
 {name:"TITAN",price:250,ram:24,cpu:"450 CPU",disk:120},
 {name:"EXTREME",price:450,ram:32,cpu:"500 CPU",disk:160},
 {name:"GOD",price:590,ram:48,cpu:"600 CPU",disk:200},
 {name:"GOD PLUS",price:699,ram:64,cpu:"800 CPU",disk:250,hot:true}
];
const FILTERS=[["All",()=>true],["Starter (1–4GB)",p=>p.ram<=4],["Mid (6–16GB)",p=>p.ram>=6&&p.ram<=16],["High (24GB+)",p=>p.ram>=24]];
let cur=0;
function draw(){
 document.getElementById('tabs').innerHTML=FILTERS.map((f,i)=>`<button class="tab${i===cur?' on':''}" data-i="${i}">${f[0]}</button>`).join('');
 document.getElementById('grid').innerHTML=PLANS.filter(FILTERS[cur][1]).map(p=>`<div class="card${p.hot?' hot':''}"><h3>${p.name}</h3><div class="price">₹${p.price}<small>/mo</small></div><div class="ram">${p.ram}GB RAM</div><ul><li>${p.cpu}</li><li>${p.disk}GB NVMe SSD</li><li>AMD Ryzen 7</li><li>DDoS Protection</li><li>AetherPanel</li></ul><a class="btn" href="#">Buy Now</a></div>`).join('');
 document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{cur=+b.dataset.i;draw()});
}
draw();
document.getElementById('rows').innerHTML=PLANS.map(p=>`<tr><td>${p.name}</td><td>${p.ram}GB</td><td>${p.cpu}</td><td>${p.disk}GB</td><td>₹${p.price}/mo</td></tr>`).join('');

// ---- 3D background ----
const renderer=new THREE.WebGLRenderer({canvas:document.getElementById('bg'),antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(55,1,.1,200);cam.position.z=9;
const c=document.createElement('canvas');c.width=1024;c.height=512;const x=c.getContext('2d');
x.fillStyle='#b8b8c4';x.fillRect(0,0,1024,512);
for(let i=0;i<120;i++){const px=Math.random()*1024,py=Math.random()*512,r=4+Math.random()*26,g=x.createRadialGradient(px,py,r*.2,px,py,r);
 g.addColorStop(0,'rgba(70,70,86,.55)');g.addColorStop(1,'rgba(235,235,245,.25)');x.fillStyle=g;x.beginPath();x.arc(px,py,r,0,7);x.fill()}
const tex=new THREE.CanvasTexture(c);
const moon=new THREE.Mesh(new THREE.SphereGeometry(2,48,48),new THREE.MeshStandardMaterial({map:tex,bumpMap:tex,bumpScale:.06,roughness:1}));
moon.position.set(5.5,3,-4);scene.add(moon);
scene.add(new THREE.AmbientLight(0x2a3060,.9));
const sun=new THREE.DirectionalLight(0xfff4e0,1.5);sun.position.set(-5,3,6);scene.add(sun);
function stars(n,s,sp,col){const g=new THREE.BufferGeometry(),a=new Float32Array(n*3);for(let i=0;i<n*3;i++)a[i]=(Math.random()-.5)*sp;
 g.setAttribute('position',new THREE.BufferAttribute(a,3));return new THREE.Points(g,new THREE.PointsMaterial({color:col,size:s,transparent:true,opacity:.9}))}
const s1=stars(1600,.07,120,0xffffff),s2=stars(450,.14,90,0xa9b6ff);scene.add(s1,s2);
let mx=0,my=0,sy=0;
addEventListener('pointermove',e=>{mx=e.clientX/innerWidth-.5;my=e.clientY/innerHeight-.5});
addEventListener('scroll',()=>{sy=scrollY});
function size(){renderer.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();moon.position.x=innerWidth<700?3:5.5}
addEventListener('resize',size);size();
const clk=new THREE.Clock();
(function loop(){const t=clk.getElapsedTime();
 moon.rotation.y=t*.06;s1.rotation.y=t*.004;s2.rotation.y=-t*.006;
 cam.position.x+=(mx*1.2-cam.position.x)*.04;cam.position.y+=(-my*.8-sy*.0012-cam.position.y)*.04;cam.lookAt(0,-sy*.0006,0);
 renderer.render(scene,cam);requestAnimationFrame(loop)})();
</script>
</body>
</html>
